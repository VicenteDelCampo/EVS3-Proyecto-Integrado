<!DOCTYPE html>
<html lang="es">
    <head>
        {% load static %}
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Actualizar Producto</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
            body { background-color: #e8ecf2 !important; color: #1e293b; font-family: sans-serif; }
        </style>
    </head>
    <body>
        <div class="fs-5 fw-bold ">
            <nav class="navbar navbar-expand-lg p-3" style="background-color: #25a1b9;">
            <div class="container-fluid" >
                <a class="navbar-brand link-light" href="/administrar_productos/"> &lt;- Volver a Productos</a>
                <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <span class="nav-link link-light">Usuario: {{ nomUsuario }}</span>
                    </li>
                </ul>
              </div>
            </div>
            </nav>  
        </div>

        <div class="container py-4" style="max-width: 900px;">
            <div class="mb-4 pb-2 border-bottom">
                <h2 class="h4 fw-bold mb-1">Modificar Producto</h2>
                <p class="text-muted small mb-0">Actualiza la información del producto seleccionado.</p>
            </div>

            <div class="bg-white p-4 mb-4" style="border-radius: 12px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
                <h3 class="h6 fw-semibold mb-3 text-secondary" ><i class="bi bi-pencil-square me-1"></i> Editando Producto ID: {{ rs.0.id }}</h3>
                <form action="/actualizar_producto/{{ rs.0.id }}/" method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label small text-secondary fw-semibold">Nombre del Producto</label>
                            <input class="form-control" type="text" name="txtnompro" value="{{ rs.0.nombre }}" required style="border-color: #cbd5e1; border-radius: 8px;">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-secondary fw-semibold">Precio</label>
                            <input class="form-control" type="number" name="numprepro" value="{{ rs.0.precio }}" required style="border-color: #cbd5e1; border-radius: 8px;">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label small text-secondary fw-semibold">Descripción</label>
                            <input class="form-control" type="text" name="txtdespro" value="{{ rs.0.descripcion }}" required style="border-color: #cbd5e1; border-radius: 8px;">
                        </div>
                        <div class="col-12 text-end pt-2">
                            <a href="/administrar_productos/" class="btn btn-outline-secondary me-2 px-4" style="border-radius: 8px;">Cancelar</a>
                            <button class="btn px-4 text-white fw-medium" type="submit" style="background-color: #4f46e5; border-radius: 8px;">
                                <i class="bi bi-save me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
