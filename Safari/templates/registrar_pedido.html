<!DOCTYPE html>
<html lang="es">
    <head>
        {% load static %}
        <meta charset="utf-8">
        <title>Tomar Pedido | Parque Safari</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        
        <script>
            const botonCerrarSesion = () => {
                Swal.fire({
                    title: "Cerrar Sesión",
                    text: "¿Estás seguro(a) de querer cerrar la sesión?",
                    icon: "question",
                    showCancelButton: true,
                    confirmButtonColor: "#84530d",
                    cancelButtonColor: "#94a3b8",
                    confirmButtonText: "Aceptar",
                    cancelButtonText: "Cancelar"
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = "/cerrar_sesion/";
                    }
                });
            }
        </script>

        <link rel="stylesheet" href="{% static 'estilos.css' %}">
</head>
    <body>
        
        <nav class="navbar navbar-expand-lg navbar-safari sticky-top">
            <div class="container-fluid">
                <div class="d-flex align-items-center">
                    <a href="/panel_mesero/" class="btn-back-safari me-3"><i class="bi bi-arrow-left"></i> Volver</a>
                    <span class="brand-safari">🦁 Parque Safari</span>
                    <span class="user-nav-label">Usuario: {{ nomUsuario|default:"ADMIN" }}</span>
                </div>
                <div class="ms-auto d-flex align-items-center gap-2">
                    <button type="button" onclick="botonCerrarSesion()" class="btn-logout-safari"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
                </div>
            </div>
        </nav>


        <div class="container py-5" style="max-width: 880px;">
            {% if r %} <script>Swal.fire({title: "Pedido Registrado", text: "{{ r }}", icon: "success", confirmButtonColor: "#84530d"});</script> {% endif %}

            <div class="mb-2">
                <h2 class="fw-bold d-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-journal-plus" style="color: #c97a16;"></i>
                    <span>Registrar Pedido a Mesa</span>
                </h2>
                <p class="small mb-0" style="color: #6e5a44;">Selecciona la mesa y el producto solicitado por el visitante.</p>
            </div>
            <div class="safari-divider"></div>

            <div class="safari-card p-4">
                <form action="/registrar_pedido/" method="post">
                    {% csrf_token %}
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label-safari">Seleccionar Mesa</label>
                            <select name="cbomesa" class="form-select" required>
                                {% for m in mesas %}
                                    <option value="{{ m.id }}">{{ m.nombre }} ({{ m.pdv.nombre }}) - {{ m.estado }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label-safari">Producto / Menú</label>
                            <select name="cboproducto" class="form-select" required>
                                {% for p in productos %}
                                    <option value="{{ p.id }}">{{ p.nombre }} (${{ p.precio }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-1">
                            <label class="form-label-safari">Cant.</label>
                            <input type="number" name="txtcantidad" id="txtcantidad" value="1" min="1" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn-safari-submit w-100">
                                <i class="bi bi-plus-circle me-1"></i> Agregar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

	<script>
		// -----------------------------------------------------------------
		// --- Validación para que el campo "txtid" acepte solo números. ---
		// -----------------------------------------------------------------
		const inputtxtcantidad = document.getElementById('txtcantidad');

		// Bloqueo anticipado en teclas presionadas
		inputtxtcantidad.addEventListener('keydown', function (e) {
			const tecla = e.key;
			const permitido = /^[0-9]$/;
			const especiales = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'];

			// Bloquear explícitamente "+" y "e"
			if (tecla === '+' || tecla.toLowerCase() === 'e') {
				e.preventDefault();
				return;
			}

			// Limitar a 5 dígitos (excepto con teclas especiales)
			if (!especiales.includes(tecla) && this.value.length >= 5) {
				e.preventDefault();
				return;
			}

			// Bloquear lo que no sea número ni tecla especial
			if (!permitido.test(tecla) && !especiales.includes(tecla)) {
				e.preventDefault();
			}
		});

		// Validación adicional por si se cuela algún carácter (ej. con tildes o pegado)
		inputid.addEventListener('input', function () {
			// Eliminar cualquier carácter que no sea dígito
			this.value = this.value.replace(/[^0-9]/g, '');

			// Limitar a máximo 7 caracteres (por si se pega texto largo)
			if (this.value.length > 7) {
				this.value = this.value.slice(0, 7);
			}
		});
	</script>

    </body>
</html>
