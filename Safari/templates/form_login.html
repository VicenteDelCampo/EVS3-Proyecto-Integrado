<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Login</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body style="background-color: #e8dfce;">

        <div class="fs-5 fw-bold">
            <nav class="navbar navbar-expand-lg p-3 " style="background-color: #f9db6d;">
            <div class="container-fluid" >
                <a class="navbar-brand" href="/">Parque Safari</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#"></a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#"></a>
                    </li>
                </ul>
                <a href=""class="navbar-text link-underline-opacity-0 link-underline link-success">
                    Ingresar
                </a>
              </div>
            </div>
            </nav>  
        </div>

     
        <div class="d-flex justify-content-center align-items-center min-vh-100 ">
            <div class="card p-4 shadow-sm" style="width: 350px;">
                <h3 class="text-center mb-3">Login</h3>
                <form action="/panel_admin/" method="POST">
                    {% csrf_token %}    
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Ingrese Rut Trabajador" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Ingrese Contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 text-white">Ingresar</button>
                </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
