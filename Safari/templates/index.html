<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login - Parque Safari</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css">
    <style>
        body {
            background-color: #f5f0e8;
            color: #2d1b00;
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
        }
        .navbar-safari { background-color: #2d1b00; }
        .navbar-safari .navbar-brand { color: #e8a020 !important; font-weight: 700; }
        .navbar-safari .nav-link { color: #f5f0e8 !important; }
        .navbar-safari .nav-link:hover { color: #e8a020 !important; }
        .login-card {
            background-color: #fffdf7;
            border: 1px solid #ddd0b8;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(45,27,0,0.12);
        }
        .form-control:focus {
            border-color: #c4850a;
            box-shadow: 0 0 0 0.2rem rgba(196, 133, 10, 0.2);
        }
        .form-control {
            border-radius: 10px;
            border-color: #ddd0b8;
            padding: 0.65rem 1rem;
        }
        .btn-login {
            background-color: #8b5e1a;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            padding: 0.6rem 1.5rem;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .btn-login:hover {
            background-color: #c4850a;
            color: #fff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="fs-5 fw-bold">
        <nav class="navbar navbar-expand-lg p-3 navbar-safari">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">🦁 Parque Safari</a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
    </div>

    {% if r %}
        <script>
            Swal.fire({
                title: "Acción OK",
                text: "{{ r }}",
                icon: "success",
                confirmButtonText: "Aceptar",
                confirmButtonColor: "#8b5e1a",
                timer: 3000
            });
        </script>
    {% endif %}

    {% if r2 %}
        <script>
            Swal.fire({
                title: "Error",
                text: "{{ r2 }}",
                icon: "error",
                confirmButtonText: "Aceptar",
                confirmButtonColor: "#c0392b",
                timer: 3000
            });
        </script>
    {% endif %}

    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card p-5" style="width: 400px;">
            <div class="text-center mb-4">
                <div style="font-size: 2.8rem; line-height: 1;">🦁</div>
                <h3 class="fw-bold mt-2 mb-0" style="color: #2d1b00;">Parque Safari</h3>
                <p class="text-secondary small mt-1">Ingresa tus credenciales para continuar</p>
            </div>
            <form action="/login/" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color: #6b4c1e;">
                        <i class="bi bi-person me-1"></i>Nombre de Usuario
                    </label>
                    <input type="text" name="txtusu" class="form-control" placeholder="Ingrese Nombre Trabajador" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold" style="color: #6b4c1e;">
                        <i class="bi bi-lock me-1"></i>Contraseña
                    </label>
                    <input type="password" name="txtpas" class="form-control" placeholder="Ingrese Contraseña" required>
                </div>
                <button type="submit" id="btnlogin" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
