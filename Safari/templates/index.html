<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login - Parque Safari</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="{% static 'estilos.css' %}">
</head>
<body>
    <div class="fs-5 fw-bold">
        <nav class="navbar navbar-expand-lg p-3 navbar-safari">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">🦁 Parque Safari</a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
    </div>

    {% if r %}
        <script>
            Swal.fire({
                title: "Acción OK",
                text: "{{ r }}",
                icon: "success",
                confirmButtonText: "Aceptar",
                confirmButtonColor: "#8b5e1a",
                timer: 3000
            });
        </script>
    {% endif %}

    {% if r2 %}
        <script>
            Swal.fire({
                title: "Error",
                text: "{{ r2 }}",
                icon: "error",
                confirmButtonText: "Aceptar",
                confirmButtonColor: "#c0392b",
                timer: 3000
            });
        </script>
    {% endif %}

    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card p-5" style="width: 400px;">
            <div class="text-center mb-4">
                <div style="font-size: 2.8rem; line-height: 1;">🦁</div>
                <h3 class="fw-bold mt-2 mb-0" style="color: #2d1b00;">Parque Safari</h3>
                <p class="text-secondary small mt-1">Ingresa tus credenciales para continuar</p>
            </div>
            <form action="/login/" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color: #6b4c1e;">
                        <i class="bi bi-person me-1"></i>Nombre de Usuario
                    </label>
                    <input type="text" name="txtusu" id="txtusu" class="form-control" placeholder="Ingrese Nombre Trabajador" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold" style="color: #6b4c1e;">
                        <i class="bi bi-lock me-1"></i>Contraseña
                    </label>
                    <input type="password" name="txtpas" id="txtpas" class="form-control" placeholder="Ingrese Contraseña" required>
                </div>
                <button type="submit" id="btnlogin" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                </button>
            </form>
        </div>
    </div>

    <script>
		const inputusuarios = document.getElementById('txtusu');
		inputusuarios.addEventListener('input', function () {
			let limpio = this.value.replace(/[^a-zA-Z0-9.-]/g, '');
			this.value = limpio;
		});
	</script>
	<script>
		const inputpassword = document.getElementById('txtpas');
		inputpassword.addEventListener('input', function () {
			let limpio = this.value.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]/g, '');
			this.value = limpio;
		});
	</script>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
